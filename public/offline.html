  </style>
</head>
<body><main class="card"><div class="mark">↗</div><small>LST RUTA</small><h1>Trenutno nema interneta.</h1><p>Za ture, poruke i prijavu potrebna je veza. Poveži se na internet i pokušaj ponovo.</p><button onclick="location.reload()">Pokušaj ponovo</button></main></body>
